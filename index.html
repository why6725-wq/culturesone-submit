<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>경영지원팀 · 입사 자료 제출</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--navy:#101A46;--gold:#FEB10F;--bg:#F7F7F5;--line:#E5E5E5;--sub:#6B6F7B;--faint:#9A9DA6;--grn:#1E7A46;--grn-bg:#E9F5EE;--red:#B42318;--red-bg:#FDECEA;--amb:#8A5A00;--amb-bg:#FFF4DB;--nb:#EEF0F7}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;color:#1F2330;font-size:15px;line-height:1.5}
  .wrap{max-width:520px;margin:0 auto;padding:28px 16px 48px}
  .brand{font-size:13px;font-weight:700;color:var(--navy);letter-spacing:.02em}
  h1{font-size:22px;color:var(--navy);margin:6px 0 4px}
  .sub{color:var(--sub);font-size:13px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:12px}
  .prog{display:flex;align-items:baseline;justify-content:space-between}
  .prog b{font-size:26px;color:var(--navy)}
  .bar{height:6px;background:#EEEEEC;border-radius:3px;margin-top:10px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--navy);border-radius:3px;transition:width .2s}
  .it-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .it-h b{font-size:16px;color:var(--navy)}
  .help{font-size:13px;color:var(--sub);margin:4px 0 12px}
  .bd{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap}
  .b-no{background:#F0F0EE;color:var(--sub)} .b-wait{background:var(--nb);color:var(--navy)} .b-ok{background:var(--grn-bg);color:var(--grn)} .b-re{background:var(--red-bg);color:var(--red)}
  input[type=text],input[type=email]{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:inherit}
  input[type=file]{width:100%;font-size:14px;margin:4px 0}
  .drop{display:block;position:relative;border:1.5px dashed #C7CCE0;border-radius:12px;padding:18px 14px;text-align:center;cursor:pointer;background:#FAFBFD;margin-top:4px}
  .drop input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0}
  .drop-t{display:block;font-size:14px;color:var(--sub)}
  .drop-f{display:block;font-size:13px;color:var(--navy);font-weight:600;margin-top:6px;word-break:break-all}
  .drop.over{border-color:var(--navy);background:var(--nb)}
  .drop.has{border-style:solid;border-color:var(--navy)}
  .ch{display:flex;gap:8px;margin-bottom:10px}
  .ch label{flex:1;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;font-size:14px;cursor:pointer}
  .ch label.on{border-color:var(--navy);background:var(--nb);color:var(--navy);font-weight:700}
  .ch input{display:none}
  .btn{display:block;width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;background:var(--navy);color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .done-v{font-size:14px;background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:4px;word-break:break-all}
  .memo{background:var(--red-bg);color:var(--red);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}
  .note{font-size:12px;color:var(--faint);margin-top:14px;line-height:1.6}
  .msg{border-radius:10px;padding:14px;font-size:14px}
  .msg.bad{background:var(--red-bg);color:var(--red)}
  .msg.ok{background:var(--grn-bg);color:var(--grn);margin-top:12px}
  .load{padding:60px 0;text-align:center;color:var(--sub)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:9;max-width:90%}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">CULTURES ONE · 경영지원팀</div>
  <div id="app"><div class="load">불러오는 중…</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
// 자료를 주고받는 곳: 경영지원 허브 Apps Script의 「직원 링크」 배포 주소 (실행: 나, 액세스: 모든 사용자)
var API = 'https://script.google.com/macros/s/AKfycby5F1k5nU2oWfbkNcUpL59ahZhYdd2JIaqgPzlzLHor2DWsmenQbIUsDGLtON4BuSTAbA/exec';
// 비밀코드는 주소의 # 뒤에 있음 (# 뒤는 서버로 전송되지 않음)
var CODE = (function(){ var m = (location.hash + '&' + location.search).match(/[#?&]t=([a-f0-9]{40,})/i); return m ? m[1].toLowerCase() : ''; })();
function api(body){
  body.t = CODE;
  return fetch(API, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', credentials: 'omit' })
    .then(function(r){ return r.text(); })
    .then(function(t){ var j; try { j = JSON.parse(t); } catch(e){ throw new Error('서버 응답을 읽지 못했습니다. 잠시 후 다시 시도해 주십시오.'); } if(j.error) throw new Error(j.error); return j; });
}
var ME = null;
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(t){ var e = document.getElementById('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(function(){ e.style.display = 'none'; }, 2200); }
function md(s){ var p = String(s || '').split('-'); return p.length === 3 ? (+p[0]) + '년 ' + (+p[1]) + '월 ' + (+p[2]) + '일' : ''; }
var STATE_TXT = { '': ['미제출', 'b-no'], '제출': ['제출 완료 · 확인 중', 'b-wait'], '확인': ['확인 완료', 'b-ok'], '다시요청': ['다시 제출해 주십시오', 'b-re'], '취소': ['미제출', 'b-no'] };
var PHOTO = {};   // 사진 항목에서 고른 방법 (화면에서만)
function isDone(x){ return x.state === '제출' || x.state === '확인'; }
function render(){
  var a = document.getElementById('app');
  if(ME.notFound){
    a.innerHTML = '<h1>링크를 확인해 주십시오</h1><div class="card"><div class="msg bad">링크가 올바르지 않거나 사용이 중지되었습니다.<br>경영지원팀에 새 링크를 요청해 주십시오.</div></div>';
    return;
  }
  var done = ME.items.filter(isDone).length, all = ME.items.length, ok = ME.items.filter(function(x){ return x.state === '확인'; }).length;
  var h = '<h1>' + esc(ME.name) + '님, 입사 자료 제출</h1><div class="sub">' + esc(ME.team || '') + (ME.hire ? ' · ' + md(ME.hire) + ' 입사' : '') + '</div>';
  h += '<div class="card"><div class="prog"><span class="sub">제출 ' + done + ' · 확인 완료 ' + ok + '</span><span><b>' + done + '</b> / ' + all + '</span></div><div class="bar"><i style="width:' + (all ? Math.round(done / all * 100) : 0) + '%"></i></div>' +
    (ok === all && all ? '<div class="msg ok">모든 자료의 확인이 완료되었습니다. 감사합니다.</div>' : done === all && all ? '<div class="msg ok">모든 자료를 제출하셨습니다. 경영지원팀이 확인하면 이곳에 표시됩니다.</div>' : '') + '</div>';
  h += ME.items.map(itemHtml).join('');
  h += '<p class="note">주민등록번호·계좌번호가 포함된 서류(주민등록등본, 통장 사본, 신분증 사본)는 이 링크로 올리지 마시고, 출력물 또는 PDF 파일로 경영지원팀 담당자에게 직접 제출해 주십시오.<br>올려 주신 파일은 경영지원팀만 열람할 수 있는 곳에 보관됩니다. 이 링크는 ' + esc(ME.name) + '님 전용이므로 다른 분께 전달하지 말아 주십시오.</p>';
  a.innerHTML = h;
  bindDrops();
}
// ===== 끌어서 넣기 (노트북·PC) =====
var TOUCH = ('ontouchstart' in window) && !window.matchMedia('(pointer:fine)').matches;
function dropName(i){
  var inp = document.getElementById('in' + i), f = inp && inp.files && inp.files[0], el = document.getElementById('fn' + i);
  if(el) el.textContent = f ? '선택한 파일: ' + f.name + ' (' + (f.size < 1024 * 1024 ? Math.max(1, Math.round(f.size / 1024)) + 'KB' : (f.size / 1024 / 1024).toFixed(1) + 'MB') + ')' : '';
  var box = el && el.parentNode; if(box) box.classList.toggle('has', !!f);
}
function bindDrops(){
  var boxes = document.querySelectorAll('.drop');
  for(var k = 0; k < boxes.length; k++) (function(box){
    var i = box.getAttribute('data-i');
    box.addEventListener('dragover', function(e){ e.preventDefault(); box.classList.add('over'); });
    box.addEventListener('dragleave', function(){ box.classList.remove('over'); });
    box.addEventListener('drop', function(e){
      e.preventDefault(); box.classList.remove('over');
      var files = e.dataTransfer && e.dataTransfer.files;
      if(!files || !files.length) return;
      var inp = document.getElementById('in' + i);
      try { inp.files = files; } catch(err){ toast('끌어서 넣기가 안 되는 브라우저입니다. 눌러서 선택해 주십시오'); return; }
      dropName(i);
    });
  })(boxes[k]);
}
// 상자 밖에 잘못 떨어뜨려도 브라우저가 파일을 열어 버리지 않게
window.addEventListener('dragover', function(e){ e.preventDefault(); });
window.addEventListener('drop', function(e){ e.preventDefault(); });
function itemHtml(x, i){
  var st = STATE_TXT[x.state] || STATE_TXT[''];
  var h = '<div class="card"><div class="it-h"><b>' + esc(x.label) + '</b><span class="bd ' + st[1] + '">' + st[0] + '</span></div><div class="help">' + esc(x.help || '') + '</div>';
  if(x.state === '다시요청' && x.memo) h += '<div class="memo">경영지원팀: ' + esc(x.memo) + '</div>';
  var shown = x.type === 'file' ? (x.hasFile ? '파일을 제출하셨습니다' : '') : x.type === 'photo' ? (x.text === '회사 촬영' ? '회사에서 촬영 예정' : x.hasFile ? '직접 촬영한 사진을 제출하셨습니다' : '') : x.text;
  if(isDone(x)) h += '<div class="done-v">' + esc(shown) + (x.time ? ' <span class="sub">· ' + esc(x.time) + '</span>' : '') + '</div>';
  if(x.state === '확인') return h + '</div>';
  var again = isDone(x);   // 확인 전이면 고쳐서 다시 낼 수 있음
  if(x.type === 'text'){
    h += '<input type="' + (x.id === 'gmail' ? 'email' : 'text') + '" id="in' + i + '" placeholder="' + esc(x.placeholder) + '" value="' + esc(x.state === '다시요청' || !again ? x.text : '') + '"' + (x.id === 'initial' ? ' style="text-transform:uppercase"' : '') + '>';
    h += '<button class="btn' + (again ? ' ghost' : '') + '" onclick="send(' + i + ', this)">' + (again ? '고쳐서 다시 제출' : '제출') + '</button>';
  } else if(x.type === 'offline'){
    if(!again) h += '<button class="btn" onclick="send(' + i + ', this)">직접 제출했습니다</button>';
  } else {
    var mode = x.type === 'photo' ? (PHOTO[x.id] || '') : 'file';
    if(x.type === 'photo'){
      h += '<div class="ch"><label class="' + (mode === '회사 촬영' ? 'on' : '') + '"><input type="radio" name="ph' + i + '" onclick="PHOTO[\'' + x.id + '\']=\'회사 촬영\';render()">회사에서 촬영</label>' +
        '<label class="' + (mode === '직접 촬영' ? 'on' : '') + '"><input type="radio" name="ph' + i + '" onclick="PHOTO[\'' + x.id + '\']=\'직접 촬영\';render()">직접 찍어서 올리기</label></div>';
      if(mode === '직접 촬영') h += '<div class="help" style="margin:0 0 8px">직접 촬영하시는 경우 비용은 별도로 지원되지 않습니다. 얼굴이 잘 보이는 밝은 사진으로 올려 주십시오.</div>';
    }
    if(mode === '회사 촬영') h += '<button class="btn' + (again ? ' ghost' : '') + '" onclick="send(' + i + ', this)">회사에서 촬영하겠습니다</button>';
    else if(mode){
      h += '<label class="drop" data-i="' + i + '"><input type="file" id="in' + i + '" accept="' + (x.type === 'photo' ? 'image/*' : '.pdf,.doc,.docx,.hwp,.hwpx,image/*') + '" onchange="dropName(' + i + ')">' +
        '<span class="drop-t">' + (TOUCH ? '눌러서 파일 선택' : '파일을 여기로 끌어다 놓거나, 눌러서 선택해 주십시오') + '</span><span class="drop-f" id="fn' + i + '"></span></label>';
      h += '<button class="btn' + (again ? ' ghost' : '') + '" onclick="send(' + i + ', this)">' + (again ? '다른 파일로 다시 제출' : '파일 올리기') + '</button>';
    }
  }
  return h + '</div>';
}
function send(i, btn){
  var x = ME.items[i], f = {};
  var go = function(){
    btn.disabled = true; btn.textContent = '보내는 중입니다… 잠시만 기다려 주십시오';
    api({ action: 'submit', id: x.id, f: f })
      .then(function(r){ ME = r; render(); toast('제출되었습니다'); })
      .catch(function(e){ btn.disabled = false; render(); toast('제출하지 못했습니다: ' + (e && e.message)); });
  };
  if(x.type === 'text'){
    f.text = (document.getElementById('in' + i).value || '').trim();
    if(!f.text){ toast(x.label + '을(를) 입력해 주십시오'); return; }
    return go();
  }
  if(x.type === 'offline') return go();
  if(x.type === 'photo' && PHOTO[x.id] === '회사 촬영'){ f.choice = '회사 촬영'; return go(); }
  var input = document.getElementById('in' + i), file = input && input.files && input.files[0];
  if(!file){ toast('파일을 선택해 주십시오'); return; }
  var maxB = (ME.maxMB || 10) * 1024 * 1024;
  // 사진은 먼저 줄인 뒤 크기를 봄(휴대폰 원본 사진은 10MB가 넘기도 함). 문서는 바로 확인
  if(!(x.type === 'photo' && /^image\//.test(file.type)) && file.size > maxB){ toast((ME.maxMB || 10) + 'MB보다 큰 파일은 올릴 수 없습니다'); return; }
  f.choice = '직접 촬영';
  var read = function(blob, name, type){
    if(blob.size > maxB){ toast((ME.maxMB || 10) + 'MB보다 큰 파일은 올릴 수 없습니다'); btn.disabled = false; render(); return; }
    var rd = new FileReader();
    rd.onload = function(){ f.file = { name: name, type: type, data: String(rd.result).split(',')[1] }; go(); };
    rd.onerror = function(){ toast('파일을 읽지 못했습니다'); btn.disabled = false; render(); };
    rd.readAsDataURL(blob);
  };
  // 사진은 휴대폰에서 미리 줄여서 보냄 (명함용으로 충분한 크기 → 올리는 시간이 크게 줄어듦). 이력서 등 문서는 원본 그대로
  if(x.type === 'photo' && /^image\//.test(file.type) && file.size > 500 * 1024){
    btn.disabled = true; btn.textContent = '사진 크기를 줄이는 중입니다…';
    shrinkImage(file, 1800, 0.85, function(small){
      if(small && small.size < file.size) read(small, file.name.replace(/\.[^.]+$/, '') + '.jpg', 'image/jpeg');
      else read(file, file.name, file.type);   // 줄이지 못하는 형식(일부 HEIC 등)은 원본 그대로
    });
    return;
  }
  read(file, file.name, file.type);
}
// 긴 쪽을 max 픽셀로 줄인 JPEG 만들기. 실패하면 null
function shrinkImage(file, max, quality, cb){
  var url = URL.createObjectURL(file), img = new Image(), done = false;
  var finish = function(b){ if(done) return; done = true; URL.revokeObjectURL(url); cb(b); };
  img.onload = function(){
    try {
      var w = img.naturalWidth, h = img.naturalHeight, r = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * r); c.height = Math.round(h * r);
      var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      if(c.toBlob) c.toBlob(function(b){ finish(b); }, 'image/jpeg', quality); else finish(null);
    } catch(e){ finish(null); }
  };
  img.onerror = function(){ finish(null); };
  setTimeout(function(){ finish(null); }, 8000);
  img.src = url;
}
function showError(msg){ document.getElementById('app').innerHTML = '<div class="card"><div class="msg bad">' + esc(msg) + '</div></div>'; }
window.addEventListener('hashchange', function(){ location.reload(); });   // 다른 링크로 바뀌면 새로 불러오기
if(!CODE){ ME = { notFound: true }; render(); }
else api({ action: 'get' }).then(function(r){ ME = r; render(); }).catch(function(e){ showError((e && e.message) || '불러오지 못했습니다. 잠시 후 다시 열어 주십시오.'); });
</script>
</body>
</html>
